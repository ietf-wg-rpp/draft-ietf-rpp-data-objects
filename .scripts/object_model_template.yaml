# RPP Data Objects — Structured Object Model
#
# Generated by check_iana_consistency.py --yaml-out <path>. Reflects the
# NORMATIVE object definitions in the draft body (Component Objects, Process
# Objects, and Resource/Data Objects) — not the IANA registry tables, which
# are a separate, derived source checked for consistency against this model
# by the same script's --check pass.
#
# Regenerate after editing the source draft; do not hand-edit this file.
#
# --- Top-level structure ---------------------------------------------------
#
# section_notes:
#   Free-form intro prose that precedes the first object in a normative H1
#   section and is not attached to any single object (e.g. the paragraph
#   directly under "# Process Objects" before the first "## ... Object"
#   heading). Keyed by the literal H1 heading text. Absent for sections with
#   no such intro (most Resource/Data Object sections start immediately with
#   the object's own header bullets, so they have no entry here).
#
# components / processes / resources:
#   One list per Object Type (Component, Process, Resource), each entry
#   built from the object's normative definition:
#
#     identifier:   camelCase machine-readable Identifier bullet
#     name:         human-readable Name bullet
#     object_type:  "Component" | "Process" | "Resource"
#     description:  the object's own "* Description:" bullet (may cite
#                   external references, e.g. "[@!RFC8543]")
#     preamble:     orphan prose found between the object's header bullets
#                   and its first element/operation — e.g. explanatory text
#                   that appears in the source but isn't itself a
#                   Name/Identifier/Description/Constraints attribute.
#                   Empty list if none.
#     elements:     every persisted data element, in document order
#     operations:   every operation (Resource/Process objects only), in
#                   document order
#     subsections:  non-Operations H3 subsections nested inside the object's
#                   own H2 (e.g. "### RDATA Structures in EPP Profile
#                   {#rdata-structures}" inside the dnsRecord Component
#                   Object) — content that belongs to the object but is
#                   neither a data element nor an operation. Empty list if
#                   the object has none. Each entry:
#                     heading: the subsection's heading text
#                     anchor:  its "{#...}" anchor, or "" if none
#                     notes:   its body, in document order — each prose
#                              paragraph and each top-level bullet becomes
#                              one list entry (bullets fold deeper nesting
#                              into that same entry, same as Constraints)
#     extends:      the object's "* Extends:" attribute — the NAME (not the
#                   identifier) of the object this one extends, e.g. a
#                   Domain Transfer Process Object extends "Transfer Process
#                   Object". Empty string for objects that extend nothing.
#     supported_processes: the INHERITED-process bullet list from a Data
#                   Object's "## Processes" section — the Process Objects it
#                   supports UNMODIFIED. Processes it *extends* are not
#                   listed here: they appear as their own Process Object
#                   entries (under "processes") carrying "extends". Empty
#                   list if the object declares none. Each entry:
#                     name:       the reference to the Process Object, by
#                                 Object Name — the bullet text itself
#                                 (there is no separate identifier, which
#                                 would be a redundant second key). The
#                                 short form is accepted: "Renew Process"
#                                 refers to "Renew Process Object".
#                     constraints: list of strings — same convention as an
#                                 element's Constraints
#                     notes:      orphan prose inside this entry's own block.
#                                 Empty list if none.
#
#   Each element entry:
#     identifier, name, cardinality, mutability, data_type: as defined in
#       the "Data Element Definitions" convention (CLAUDE.md)
#     description:  the element's "* Description:" bullet (a single string)
#     constraints:  the element's "* Constraints:" bullet as a LIST of
#                   strings, one per top-level constraint. A single inline
#                   value ("Constraints: MUST be positive.") becomes a
#                   one-item list; "(None)" (or nothing at all) becomes an
#                   empty list []. When the source instead has a blank
#                   "Constraints:" line followed by a nested bullet list
#                   (e.g. the Status Object's "label" element), each
#                   top-level nested bullet becomes one list entry, with any
#                   further nesting under it (a sub-list, a numbered list)
#                   folded into that same entry as extra newline-joined
#                   lines, keeping the original markers (e.g. "1.", "2.").
#     notes:        orphan prose inside the element's own block not captured
#                   by any of the fields above (e.g. a stray unstructured
#                   paragraph). Empty list if none.
#
#   Each operation entry:
#     identifier, name: as defined in the operation heading /
#       "* Identifier:" bullet
#     description:  plain prose describing the operation (this document's
#                   convention: NOT a "* Description:" bullet, which is
#                   element/object-only — every operation's description is
#                   prose written directly after its "* Identifier:" bullet).
#                   Covers every prose paragraph between "* Identifier:" and
#                   the first "* Authorisation:"/"* Input:"/"* Output:"
#                   bullet (or the transient-params marker), newline-joined
#                   if there is more than one paragraph.
#     authorisation: the operation's "* Authorisation:" bullet as a LIST of
#                   strings, one per top-level sub-bullet (same
#                   nested-bullet folding as an element's "constraints" —
#                   deeper nesting, e.g. "Pull transfer:"/"Push transfer:"
#                   sub-cases, is newline-joined into that entry). Empty
#                   list if the operation has no Authorisation bullet.
#     input:        the operation's "* Input:" bullet value (a single
#                   string, e.g. "Object identifier"). Empty string if absent.
#     output:       the operation's "* Output:" bullet value (a single
#                   string). Empty string if absent.
#     notes:        orphan prose in the operation's body beyond description/
#                   authorisation/input/output (e.g. a further explanatory
#                   paragraph after the Authorisation bullet, or the
#                   "the following transient data elements..." lead-in
#                   sentence). Empty list if none.
#     params:       transient (non-persisted) operation parameters, each
#                   with identifier, name, cardinality, data_type,
#                   description, constraints, notes — same meaning as for
#                   elements.
#
# Nothing here duplicates content already captured in a structured field:
# "notes"/"preamble"/"section_notes" contain ONLY the leftover prose the
# script could not attribute to a Name/Identifier/Cardinality/Mutability/
# Data Type/Description/Constraints bullet. Editorial aside notes ("A>"
# blocks, e.g. TODO/TBD/TBC markers) are intentionally excluded everywhere.
# -----------------------------------------------------------------------------

section_notes: {}
components: []
processes: []
resources: []
